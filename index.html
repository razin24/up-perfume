<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eMart Pro Dashboard</title>
    <!-- Fonts, Icons & Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --sidebar-bg: #1e1e2d;
            --sidebar-hover: #2b2b40;
            --sidebar-text: #9899ac;
            --bg-light: #f5f8fa;
            --white: #ffffff;
            --text-dark: #181c32;
            --text-muted: #a1a5b7;
            --border: #eff2f5;
            --accent: #00d084;
            --blue: #009ef7;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-light); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* Login Screen */
        .login-wrap { position: fixed; inset: 0; background: var(--sidebar-bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: var(--white); padding: 40px; border-radius: 12px; width: 350px; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin-top: 20px; border: 1px solid var(--border); border-radius: 6px; }
        .login-card button { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; margin-top: 15px; cursor: pointer; font-weight: 600; }

        /* Layout & Sidebar */
        .sidebar { width: 250px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; }
        .brand { padding: 20px; font-size: 22px; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; }
        .brand img { width: 30px; }
        .nav-btn { background: transparent; color: var(--sidebar-text); border: none; padding: 12px 20px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 14px; width: 100%; }
        .nav-btn:hover, .nav-btn.active { background: var(--sidebar-hover); color: var(--accent); }
        .menu-label { padding: 15px 20px 5px; font-size: 10px; text-transform: uppercase; color: #565674; font-weight: 700; }
        
        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { background: var(--white); height: 65px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .content-area { padding: 30px; }
        
        /* Stats Grid - Matching the image */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--white); padding: 20px; border-radius: 8px; border: 1px solid var(--border); position: relative; }
        .stat-card h3 { font-size: 22px; color: var(--text-dark); margin-bottom: 5px; }
        .stat-card p { font-size: 13px; color: var(--text-muted); }
        .stat-card .icon { position: absolute; right: 20px; top: 20px; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        /* Chart & Tables */
        .card { background: var(--white); border-radius: 8px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
        .chart-container { height: 300px; width: 100%; }
        
        .table-split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
        
        /* Buttons & Inputs */
        .btn { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-primary { background: var(--blue); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        
        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; }
        .modal-content { background: var(--white); padding: 25px; border-radius: 8px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; }
    </style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-wrap">
    <div class="login-card">
        <h2>eMart CRM</h2>
        <p style="color: gray; font-size: 13px;">Admin or Moderator Login</p>
        <input type="password" id="authToken" placeholder="Enter PIN/Token">
        <button onclick="login()">LOGIN</button>
        <p id="loginError" style="color: red; font-size: 12px; margin-top: 10px;"></p>
    </div>
</div>

<!-- Sidebar -->
<aside class="sidebar" id="appSidebar" style="display:none;">
    <div class="brand">
        <i class="fas fa-shopping-basket" style="color: var(--accent);"></i> eMart Pro
    </div>
    <div class="menu-label">Dashboard</div>
    <button class="nav-btn active" onclick="switchTab('dashboard')"><i class="fas fa-home"></i> Dashboard</button>
    <div class="menu-label">Order Management</div>
    <button class="nav-btn" onclick="switchTab('orders')"><i class="fas fa-shopping-cart"></i> Orders</button>
    <div class="menu-label">Item Management</div>
    <button class="nav-btn" onclick="switchTab('products')"><i class="fas fa-box-open"></i> Products</button>
    <div style="margin-top: auto; padding: 20px;">
        <div id="roleBadge" style="background: #2b2b40; color: #00d084; padding: 10px; text-align: center; border-radius: 6px; margin-bottom: 10px; font-size: 12px; font-weight: bold;"></div>
        <button class="nav-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
</aside>

<!-- Main Content -->
<main class="main-content" id="appMain" style="display:none;">
    <header class="topbar">
        <div style="color: var(--text-muted);"><i class="fas fa-search"></i> Search...</div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="btn btn-primary" onclick="fetchData()"><i class="fas fa-sync"></i> Refresh</button>
            <div style="width: 35px; height: 35px; background: #e4e6ef; border-radius: 50%;"></div>
        </div>
    </header>

    <div class="content-area">
        <!-- Dashboard Tab -->
        <div id="tab-dashboard" class="tab-content">
            <!-- Row 1 Stats -->
            <div class="stat-grid">
                <div class="stat-card">
                    <h3 id="st-earn">৳0</h3><p>Total Earning</p>
                    <div class="icon" style="background: #e8fff3; color: #00d084;"><i class="fas fa-dollar-sign"></i></div>
                </div>
                <div class="stat-card">
                    <h3 id="st-orders">0</h3><p>Total Orders</p>
                    <div class="icon" style="background: #e1f0ff; color: #009ef7;"><i class="fas fa-shopping-bag"></i></div>
                </div>
                <div class="stat-card">
                    <h3 id="st-instock">0</h3><p>In Stock Items</p>
                    <div class="icon" style="background: #fff4de; color: #ffa800;"><i class="fas fa-box"></i></div>
                </div>
                <div class="stat-card">
                    <h3 id="st-outstock">0</h3><p>Out Of Stock</p>
                    <div class="icon" style="background: #ffe2e5; color: #f64e60;"><i class="fas fa-times-circle"></i></div>
                </div>
            </div>
            
            <!-- Chart Section -->
            <div class="card">
                <h4 style="margin-bottom: 20px;">Earning Overview</h4>
                <div class="chart-container">
                    <canvas id="earningChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Orders Tab -->
        <div id="tab-orders" class="tab-content hidden">
            <div class="card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <h3>All Orders</h3>
                </div>
                <table>
                    <thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="ordersTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Products Tab -->
        <div id="tab-products" class="tab-content hidden">
            <div class="card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <h3>Products</h3>
                    <button class="btn btn-accent admin-only" onclick="openAddProductModal()">+ Add Product</button>
                </div>
                <table>
                    <thead><tr><th>SKU</th><th>Name</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
                    <tbody id="productsTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Order Edit Modal (Full Editable for Admin) -->
<div id="orderModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 15px;">Edit Order</h3>
        <input type="hidden" id="editOrderId">
        
        <div class="form-group"><label>Status (Mod & Admin)</label>
            <select id="editStatus">
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>
        
        <div id="adminOrderFields" class="admin-only">
            <div class="form-group"><label>Customer Name</label><input type="text" id="editCName"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="editCPhone"></div>
            <div class="form-group"><label>Full Address</label><input type="text" id="editCAddress"></div>
            <div class="form-group"><label>Subtotal (৳)</label><input type="number" id="editSub"></div>
            <div class="form-group"><label>Delivery Charge (৳)</label><input type="number" id="editDel"></div>
            <div class="form-group"><label>Discount (৳)</label><input type="number" id="editDisc"></div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn btn-primary" style="flex: 1;" onclick="saveOrder()">Save Changes</button>
            <button class="btn" style="flex: 1; background: #e4e6ef;" onclick="closeModal('orderModal')">Cancel</button>
        </div>
    </div>
</div>

<script>
// ⚠️ IMPORTANT: Replace with your actual Web App URL
const API_URL = "https://script.google.com/macros/s/AKfycbw0r_Z6SwaVC6az1apUkA-V3YST9hWmcVvmJFEmB7ReKEgEMWZhiixUaaCFqiRFgd_B/exec"; 
let token = sessionStorage.getItem("crm_token") || "";
let userRole = ""; 
let globalOrders = [];
let chartInstance = null;

if(token) login(true);

async function login(auto = false) {
    if(!auto) token = document.getElementById("authToken").value.trim();
    if(!token) return;
    
    document.getElementById("loginError").textContent = "Connecting...";
    try {
        const res = await fetch(`${API_URL}?action=dashboard_data&token=${token}`);
        const data = await res.json();
        
        if(data.ok) {
            sessionStorage.setItem("crm_token", token);
            userRole = data.role; // 'admin' or 'moderator'
            
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("appSidebar").style.display = "flex";
            document.getElementById("appMain").style.display = "flex";
            document.getElementById("roleBadge").textContent = `Logged in as: ${userRole.toUpperCase()}`;
            
            // Apply Permissions (Hide elements meant for Admin only)
            if(userRole === "moderator") {
                document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
            }
            
            populateData(data);
        } else {
            document.getElementById("loginError").textContent = data.error;
            sessionStorage.removeItem("crm_token");
        }
    } catch (e) {
        document.getElementById("loginError").textContent = "Network Error.";
    }
}

function logout() {
    sessionStorage.removeItem("crm_token");
    location.reload();
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.remove('hidden');
    event.currentTarget.classList.add('active');
}

async function fetchData() {
    const res = await fetch(`${API_URL}?action=dashboard_data&token=${token}`);
    const data = await res.json();
    if(data.ok) populateData(data);
}

function populateData(data) {
    globalOrders = data.orders;
    
    // Dashboard Stats
    document.getElementById("st-earn").textContent = `৳${data.stats.revenue.toLocaleString()}`;
    document.getElementById("st-orders").textContent = data.stats.totalOrders;
    document.getElementById("st-instock").textContent = data.stats.inStock;
    document.getElementById("st-outstock").textContent = data.stats.outStock;
    
    // Render Tables
    document.getElementById("ordersTable").innerHTML = data.orders.map(o => `
        <tr>
            <td><strong>${o.Order_ID}</strong></td>
            <td>${o.Customer_Name}</td>
            <td>${o.Phone}</td>
            <td style="color: var(--accent); font-weight: bold;">৳${o.Grand_Total}</td>
            <td><span class="badge" style="background: ${o.Order_Status==='Delivered'?'#e8fff3':'#fff4de'}; color: ${o.Order_Status==='Delivered'?'#00d084':'#ffa800'}">${o.Order_Status}</span></td>
            <td><button class="btn" style="background: #e1f0ff; color: var(--blue);" onclick="openEditOrder('${o.Order_ID}')">Manage</button></td>
        </tr>
    `).join("");

    document.getElementById("productsTable").innerHTML = data.products.map(p => `
        <tr>
            <td>${p.Product_SKU}</td>
            <td>${p.Product_Name}</td>
            <td>৳${p.Selling_Price}</td>
            <td>${p.Stock}</td>
            <td><button class="btn admin-only" style="background: #e4e6ef;" onclick="alert('Product update coming soon!')">Edit</button></td>
        </tr>
    `).join("");

    // Initialize Chart
    initChart(data.orders);
}

function initChart(orders) {
    const ctx = document.getElementById('earningChart').getContext('2d');
    if(chartInstance) chartInstance.destroy();
    
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'], // Mock labels for visual
            datasets: [{
                label: 'Earnings',
                data: [12000, 19000, 15000, 25000], // Render mock data to look like eMart
                backgroundColor: '#009ef7',
                borderRadius: 4
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

// Edit Order Modals
function openEditOrder(id) {
    const order = globalOrders.find(o => o.Order_ID === id);
    if(!order) return;
    
    document.getElementById("editOrderId").value = id;
    document.getElementById("editStatus").value = order.Order_Status;
    
    if(userRole === 'admin') {
        document.getElementById("editCName").value = order.Customer_Name;
        document.getElementById("editCPhone").value = order.Phone;
        document.getElementById("editCAddress").value = order.Full_Address;
        document.getElementById("editSub").value = order.Subtotal;
        document.getElementById("editDel").value = order.Delivery_Charge;
        document.getElementById("editDisc").value = order.Discount;
    }
    document.getElementById("orderModal").style.display = "flex";
}

async function saveOrder() {
    const id = document.getElementById("editOrderId").value;
    const status = document.getElementById("editStatus").value;
    
    let payload = { token: token };
    
    if(userRole === 'moderator') {
        payload.action = "updateStatus";
        payload.orderId = id;
        payload.status = status;
    } else {
        payload.action = "updateOrderFull";
        payload.orderId = id;
        payload.status = status;
        payload.Customer_Name = document.getElementById("editCName").value;
        payload.Phone = document.getElementById("editCPhone").value;
        payload.Full_Address = document.getElementById("editCAddress").value;
        payload.Subtotal = document.getElementById("editSub").value;
        payload.Delivery_Charge = document.getElementById("editDel").value;
        payload.Discount = document.getElementById("editDisc").value;
    }
    
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await res.json();
    
    if(data.ok) {
        alert("Saved successfully!");
        closeModal("orderModal");
        if(userRole === 'admin') fetch(API_URL, { method:"POST", body: JSON.stringify({action: "updateStatus", token: token, orderId: id, status: status})}); // ensure status syncs for admin full update
        fetchData();
    } else {
        alert("Error: " + data.error);
    }
}

function closeModal(id) { document.getElementById(id).style.display = "none"; }
</script>
</body>
</html>
