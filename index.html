<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UP Perfume CRM</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#292720;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:25px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:26px Georgia;letter-spacing:6px}.card{background:white;border:1px solid #e5dfd4;padding:20px;margin:18px 0;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#faf8f4;padding:18px}.stat b{display:block;font:28px Georgia;margin-top:8px}input,button,select{padding:11px;border:1px solid #d8d0c3;background:white}button{background:#24231f;color:white;cursor:pointer}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:750px}td,th{padding:12px;border-bottom:1px solid #eee;text-align:left}th{font-size:11px;letter-spacing:1px}.muted{color:#777}.hidden{display:none}.login{max-width:420px;margin:12vh auto}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<div id="login" class="card login"><div class="brand">U P <small>CRM</small></div><h2>Admin sign in</h2><p class="muted">Enter the admin token configured in Apps Script.</p><input id="token" type="password" placeholder="Admin token" style="width:100%"><button onclick="signIn()" style="width:100%;margin-top:10px">SIGN IN</button><p id="loginMsg" class="muted"></p></div>
<div id="app" class="hidden"><header class="head"><div class="brand">U P <small>CRM</small></div><button onclick="logout()">LOG OUT</button></header><section class="card"><div class="actions"><button onclick="loadAll()">REFRESH</button><input id="search" placeholder="Search order, customer, phone" oninput="render()"><select id="filter" onchange="render()"><option value="">All statuses</option><option>Pending</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div></section>
<div class="grid"><div class="stat">Total Orders<b id="total">0</b></div><div class="stat">Pending<b id="pending">0</b></div><div class="stat">Delivered<b id="delivered">0</b></div><div class="stat">Delivered Revenue<b id="revenue">৳0</b></div></div>
<section class="card"><h2>Orders</h2><div class="tablewrap"><table><thead><tr><th>ORDER ID</th><th>DATE</th><th>CUSTOMER</th><th>PHONE</th><th>PRODUCT</th><th>TOTAL</th><th>STATUS</th><th>UPDATE</th></tr></thead><tbody id="rows"></tbody></table></div><p id="msg" class="muted"></p></section></div></div>
<script>
const API_URL="PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";let token=sessionStorage.getItem("up_crm_token")||"",orders=[];
async function api(action,data={}){let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data,token})});return r.json()}
async function signIn(){token=document.querySelector("#token").value;try{let r=await fetch(API_URL+"?action=stats&token="+encodeURIComponent(token));let d=await r.json();if(!d.ok)throw Error(d.error);sessionStorage.setItem("up_crm_token",token);document.querySelector("#login").classList.add("hidden");document.querySelector("#app").classList.remove("hidden");loadAll()}catch(e){document.querySelector("#loginMsg").textContent="Login failed: "+e.message}}
function logout(){sessionStorage.removeItem("up_crm_token");location.reload()}
async function loadAll(){document.querySelector("#msg").textContent="Loading…";try{let [a,b]=await Promise.all([fetch(API_URL+"?action=orders&token="+encodeURIComponent(token)).then(r=>r.json()),fetch(API_URL+"?action=stats&token="+encodeURIComponent(token)).then(r=>r.json())]);if(!a.ok||!b.ok)throw Error(a.error||b.error);orders=a.orders;let s=b.stats;total.textContent=s.totalOrders;pending.textContent=s.pending;delivered.textContent=s.delivered;revenue.textContent="৳"+Number(s.revenue).toLocaleString("en-BD");render();msg.textContent=""}catch(e){msg.textContent="Could not load: "+e.message}}
function render(){let q=(search.value||"").toLowerCase(),f=filter.value;rows.innerHTML=orders.filter(o=>(!f||o.Order_Status===f)&&[o.Order_ID,o.Customer_Name,o.Phone,o.Product_Summary].join(" ").toLowerCase().includes(q)).map(o=>`<tr><td>${esc(o.Order_ID)}</td><td>${esc(String(o.Order_Date).slice(0,10))}</td><td>${esc(o.Customer_Name)}</td><td>${esc(o.Phone)}</td><td>${esc(o.Product_Summary)}</td><td>৳${Number(o.Grand_Total).toLocaleString("en-BD")}</td><td>${esc(o.Order_Status)}</td><td><select onchange="changeStatus('${esc(o.Order_ID)}',this.value)">${["Pending","Confirmed","Processing","Shipped","Delivered","Cancelled","Returned"].map(s=>`<option ${s===o.Order_Status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}
async function changeStatus(id,status){try{let r=await api("updateStatus",{orderId:id,status});if(!r.ok)throw Error(r.error);await loadAll()}catch(e){alert(e.message);loadAll()}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(token){document.querySelector("#token").value=token;signIn()}
</script></body></html>
